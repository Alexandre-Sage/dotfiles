# Hyprland configuration translated from LeftWM config
# See https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Monitor configuration
# monitor=name,resolution,position,scale
# monitor=,preferred,auto,1
# Uncomment and adjust for your setup:
# monitor=HDMI-A-1,1920x1080@60,0x0,1
# monitor=eDP-1,1920x1080@60,1920x0,1

# Execute at launch
exec-once = waybar
exec-once = mako
exec-once = feh --bg-scale ~/.local/wallpaper/arc_wp1.jpg

# Input configuration
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8000ffff)  # Purple (0.5, 0.0, 1.0, 1.0)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
    
    # Allow tearing for better gaming performance
    allow_tearing = false
}

# Decoration
decoration {
    rounding = 5
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layouts
dwindle {
    pseudotile = yes
    preserve_split = yes
    force_split = 2  # 0 = split follows mouse, 1 = always split to left/top, 2 = always split to right/bottom
}

master {
    new_status = slave
    mfact = 0.5
}

# Gestures
gestures {
    workspace_swipe = on
}

# Misc settings
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# Window rules
windowrulev2 = fullscreen, class:^(DBeaver)$, title:^(Connect to a database)$

# Workspace definitions (9 workspaces like LeftWM tags)
# Workspaces are created dynamically in Hyprland

# Keybindings
# Mod key: Alt (Mod1 in X11 = Alt in Hyprland)
$mainMod = ALT

# Volume controls (no modifier)
bind = , F12, exec, amixer -q sset Master 5%+
bind = , F11, exec, amixer -q sset Master 5%-
bind = , F9, exec, pavucontrol

# Screenshot
bind = , Print, exec, grim ~/screenshot/$(date '+%Y-%m-%d_%H-%M-%S').png

# Application shortcuts
bind = $mainMod, P, exec, dmenu_run -l 15
bind = $mainMod, T, exec, alacritty
bind = $mainMod, F, exec, firefox
bind = $mainMod SHIFT, F, exec, alacritty -e yazi

# Window management
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, H, exit,

# Focus movement
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Tab, workspace, e+1

# Window movement
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod, Return, movewindow, mon:0  # Move to top (approximation)

# Window resizing
bind = $mainMod SHIFT, L, resizeactive, 50 0
bind = $mainMod SHIFT, H, resizeactive, -50 0

# Layout controls
bind = $mainMod, Space, cyclenext,
bind = $mainMod SHIFT, Space, cyclenext, prev
bind = $mainMod, M, fullscreen, 0
bind = $mainMod, U, fullscreen, 0
bind = $mainMod, E, togglesplit,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, M, layoutmsg, orientationtop
bind = $mainMod SHIFT, V, layoutmsg, orientationleft
bind = $mainMod SHIFT, E, layoutmsg, orientationcenter

# Workspace navigation (AZERTY keyboard layout)
# Note: Hyprland uses keycodes for special characters
bind = $mainMod, ampersand, workspace, 1      # &
bind = $mainMod, eacute, workspace, 2         # é
bind = $mainMod, quotedbl, workspace, 3       # "
bind = $mainMod, apostrophe, workspace, 4     # '
bind = $mainMod, parenleft, workspace, 5      # (
bind = $mainMod, minus, workspace, 6          # -
bind = $mainMod, egrave, workspace, 7         # è
bind = $mainMod, underscore, workspace, 8     # _
bind = $mainMod, ccedilla, workspace, 9       # ç

# Alternative using number row (if AZERTY keys don't work)
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9

# Move windows to workspaces (AZERTY)
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9

# Alternative using number row (if AZERTY keys don't work)
# bind = $mainMod SHIFT, 1, movetoworkspace, 1
# bind = $mainMod SHIFT, 2, movetoworkspace, 2
# bind = $mainMod SHIFT, 3, movetoworkspace, 3
# bind = $mainMod SHIFT, 4, movetoworkspace, 4
# bind = $mainMod SHIFT, 5, movetoworkspace, 5
# bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
